spring:
  application:
    name: taskmanager
  profiles:
    active: dev

  # Database configuration
  datasource:
    url: jdbc:h2:mem:taskdb
    driverClassName: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console

  #JPA configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,logger,beans,mappings
      base-path: /actuator
    health: # ✅ digabung ke dalam SATU block 'endpoints'
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: Task Manager
    version: 1.0.0
    max-task-per-page: 10

# App info
app:
  name: Task Manager
  version: 1.0.0
  max-task-per-page: 10
